# 门控开关：true = 启用该门（可能拒绝观测）；false = 关闭该门（该门放行全部观测）
# 用途：消融实验。配合 --segments-from 可在约 1 秒内对比"开关前/后"的轨迹与统计。
gates:
  yolo_conf: true           # YOLO 推理置信度阈值（detector.yolo_conf）
  detector_conf: false      # 候选置信度下限（detector.conf_min；当前是死代码，默认关闭）
  static_suppression: true  # 静态候选标记与惩罚（tracker.grid_size / static_frame_count / static_penalty）
  association: true         # 关联层：区分度不足时用置信度打破平局（方案 C）
  distance: true            # 距离门（tracker.dynamic_*）
  motion_model: true        # 运动模型门（tracker.motion_model.*）
  ransac: true              # 段后 RANSAC 清洗（ransac.*）

tracker:
  smooth_window_len: 5
  max_miss: 5
  static_frame_count: 3
  static_penalty: 120.0
  fast_speed_thresh: 100.0
  lambda_slow: 0.85
  lambda_fast: 0.65
  assoc_margin: 80.0        # 关联区分度阈值：top1/top2 代价差小于它时进入裁决
  assoc_cont_margin: 30.0   # 裁决的连续性容差(px)：次优候选到上一观测近这么多以上则改选它
  assoc_max_dist: 0.0       # 关联候选最大距离（px）；0=不启用，>0 时剔除离预测点过远的候选
  grid_size: 10
  dynamic_gain: 2.0
  dynamic_min_thresh: 200.0
  dynamic_max_thresh: 320.0
  motion_model:
    enabled: true
    window: 6              # 拟合窗口：最近 N 个已接受观测
    min_points: 5          # 至少这么多点才做二次拟合（3 参数 + 冗余）
    residual_thresh: 80.0  # 候选到二次曲线预测位置的残差阈值（px）；实测正常球 p90=54/p95=90
    rms_thresh: 20.0       # 窗口自身拟合 RMS 阈值（px），超过视为跨越击球点
    reverse_cos: -0.2      # 方向反转判定：cos(预测速度, 实测位移) 小于该值视为击球

ransac:
  min_samples: 5
  max_iter: 80
  residual_thresh: 12

detector:
  conf_min: 0.12
  yolo_conf: 0.80
